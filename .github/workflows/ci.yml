name: a1to5x

on:
  workflow_dispatch:
     inputs:
       zipname:
         description: 'ZIP NAME (Optional, kosongkan jika ingin otomatis dari link)'
         required: false
       filelink:
         description: 'File link (Direct link / Pixeldrain / dll)'
         required: true

jobs:
  a1to5x:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y git openjdk-8-jdk wget curl rsync aria2 python3 python3-pip unzip device-tree-compiler brotli android-sdk-libsparse-utils
          pip3 install protobuf==3.20.3
          pip install brotli

      - id: var
        name: Download
        run: |
          echo "Download"
          LINK="${{ github.event.inputs.filelink }}"
          CUSTOM_NAME="${{ github.event.inputs.zipname }}"

          if [[ ! -z "$CUSTOM_NAME" ]]; then
              OUT_NAME="$CUSTOM_NAME.zip"
          else
              OUT_NAME="rom_download.zip"
          fi

          aria2c -s 1 -x 1 --user-agent="Mozilla/5.0" -o "$OUT_NAME" "$LINK" || wget --user-agent="Mozilla/5.0" -O "$OUT_NAME" "$LINK"

          if [[ -z "$CUSTOM_NAME" ]]; then
              FINAL_NAME="${OUT_NAME%.*}"
          else
              FINAL_NAME="$CUSTOM_NAME"
          fi

          echo "zipname=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "filename=$OUT_NAME" >> $GITHUB_OUTPUT
          ls -la

      - name: Payload Extractor / Check Structure
        run: |
          echo "Checking ROM Structure..."
          unzip -l "${{ steps.var.outputs.filename }}"
          
          if unzip -l "${{ steps.var.outputs.filename }}" | grep -q "payload.bin"; then
              echo "Payload.bin found. Extracting..."
              unzip "${{ steps.var.outputs.filename }}" payload.bin
              export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
              python3 update-payload-extractor/extract.py payload.bin --output_dir ./
          else
              echo "Payload.bin not found! Extracting standard ROM images..."
              unzip -o "${{ steps.var.outputs.filename }}"
          fi
          
          file system.img
          ls -la

      - name: Patching Fstab
        run: |
          mkdir system/
          sudo mount system.img system/
          fstab="system/system/vendor/etc/fstab.qcom"
          sudo sed -i 's/,slotselect//g' $fstab
          sudo sed -i 's/,verify//g' $fstab
          sudo sed -i 's/forceencrypt/encryptable/g' $fstab
          sudo sed -i 's/fileencryption=ice/encryptable=footer/g' $fstab
          sudo cp system/system/vendor/etc/fstab.qcom output/fstab.qcom
          cat system/system/vendor/etc/fstab.qcom
          sudo umount system
          sudo rm -rf system
    
      - name: Mkbootimg
        run: |
          mv boot.img mkbootimg/
          cd mkbootimg
          ./mkboot boot.img boot
          rm boot.img
          cd boot
          ls
          cd ../../

      - name: Patching device tree blobs
        run: |
          mv mkbootimg/boot/kernel ./image.gz-dtb
          ls
          ./split-appended-dtb image.gz-dtb
          rm image.gz-dtb
          ls
          temp=$(ls -lS *.dtb | head -1 | awk '{print $9}')
          echo temp: $temp
          dtb=${temp##* }
          dts=${dtb%.*}.dts
          echo dtb: $dtb
          echo dts: $dts
          dtc -q -I dtb -O dts -o $dts $dtb
          rm $dtb
          echo rm: $dtb
          sed -i '/parts/{n;d;}' $dts
          sed -i '/vbmeta/d' $dts
          sed -i '/android,system/{n;d;}' $dts
          sed -i '/android,system/{n;d;}' $dts
          sed -i '/android,system/{n;d;}' $dts
          sed -i '/android,system/d' $dts
          sed -i '/,discard/{n;s/,slotselect//;}' *.dts
          sed -i 'N;/\n.*,slotselect/!P;D' $dts
          sed -i '/,slotselect/{n;d;}' $dts
          sed -i '/,slotselect/{n;d;}' $dts
          sed -i '/,slotselect/d' $dts
          sed -i '/,fstab/r flags.txt' $dts
          sed -i '/,fstab/G' $dts
          sed -i '/android,firmware/{n;d;}' $dts
          sed -i 's/,avb//g' $dts
          sed -i '/,slotselect/{n;s/disable/ok/;}' $dts
          sed -i 's/,slotselect//g' $dts
          dtc -q -I dts -O dtb -o $dtb $dts
          mv *.dts output/
          cat kernel *.dtb > image.gz-dtb
          mv image.gz-dtb mkbootimg/boot/kernel
          sed -i 's/veritykeyid=id:\w*//g' mkbootimg/boot/img_info
          cat mkbootimg/boot/img_info
          cp mkbootimg/boot/img_info output/
          cd mkbootimg
          ./mkboot boot boot.img
          cd ..
          
      - name: MakeMeSAR
        run: |
          mkdir tmp
          mv mkbootimg/boot.img tmp
          cd tmp
          ../magiskboot unpack -h boot.img
          ls
          cp -f ../ramdisk-sar.cpio ramdisk.cpio
          ../magiskboot repack boot.img
          ls -al
          cd ..
          
      - name: img2sdat && brotli
        run: |
          mv tmp/new-boot.img template/boot.img
          file system.img
          ls -al
          mv system.img template/system.img
          mv system.patch.dat template/system.patch.dat
          
          # Hapus import imp yang deprecated di Python 3.12
          sed -i '/import imp/d' rimg2sdat.py
          
          cd template
          ../rimg2sdat.py -c system.img
          ls -al
          
          # Fallback kompresi manual jika .br belum terbentuk
          if [ -f "system.new.dat" ] && [ ! -f "system.new.dat.br" ]; then
              brotli -j -v -3 system.new.dat -o system.new.dat.br
          fi
          
          rm -f system.img
          rm -f system.new.dat
          cd ..
          mv template ${{ steps.var.outputs.zipname }}
          
      - name: Upload to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.var.outputs.zipname }}
          path: |
            ${{ steps.var.outputs.zipname }}
          retention-days: 7
